<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Senior Spectrum — Is it worth it? (2027)</title>

  html,body { margin:0; height:100%; background:var(--bg); color:var(--ink);

  .wrap { display:flex; flex-direction:column; height:100%; }

    background:linear-gradient(180deg,#12151b,#0e1116); border-bottom:1px solid #222834; }
  header .name { font-size:15px; font-weight:600; letter-spacing:.2px; white-space:nowrap;
    overflow:hidden; text-overflow:ellipsis; }
  header .spacer { flex:1; }
  .stage { flex:1; display:flex; align-items:center; justify-content:center; min-height:0;
    padding:22px 16px; overflow:hidden; }
  #book { touch-action:pan-y; }
  .page-img { width:100%; height:100%; object-fit:cover; display:block;
    box-shadow:0 10px 40px rgba(0,0,0,.45); background:#fff; }
  footer { display:flex; align-items:center; justify-content:center; gap:16px;
    padding:12px; background:#12151b; border-top:1px solid #222834; }
  button { background:var(--panel); color:var(--ink); border:1px solid #2a313d; border-radius:10px;
    padding:9px 16px; font-size:14px; cursor:pointer; transition:.15s; }
  button:hover { border-color:var(--accent); color:#fff; }
  button:disabled { opacity:.35; cursor:default; }
  .counter { min-width:74px; text-align:center; color:var(--dim); font-variant-numeric:tabular-nums; }
  .hint { color:var(--dim); font-size:12.5px; }
  @media (max-width:640px) { header .name { font-size:13px; } .hint { display:none; } button { padding:8px 12px; } }
  /* pseudo-full-screen (works on iPhone, where the real Fullscreen API is blocked) */
  body.fs header, body.fs footer { display:none; }
  body.fs .stage { padding:4px; }
  #fsx { position:fixed; top:10px; right:12px; z-index:60; display:none; }
  body.fs #fsx { display:block; }
</style></head>
<body>
<button id="fsx">✕ Exit full screen</button>
<div class="wrap">
  <header>
    <span class="name">Senior Spectrum — Is it worth it? (2027)</span>
    <span class="spacer"></span>
    <span class="hint">Click a page corner or use ← → to turn</span>
    <button id="fs">Full screen</button>

  <div class="stage"><div id="book"></div></div>
  <footer>
    <button id="prev">‹ Prev</button>

    <button id="next">Next ›</button>
  </footer>
</div>

const LAYOUT = "single";
const PORTRAIT = true;
const BASE_W = 600, BASE_H = 779;
const stage = document.querySelector('.stage');
const el = document.getElementById('book');

let pf, cur = 0;
function build() {
  // Fixed sizing (crisp, fits the stage). Orientation is forced by usePortrait + capping the
  // book element's width so StPageFlip can't grow into a spread:
  //   spread = two pages (cover alone via showCover) ; single = one page ; auto = by screen width
  const availW = Math.floor(stage.clientWidth - 24), availH = Math.floor(stage.clientHeight - 24);
  const single = LAYOUT === 'single' || (LAYOUT === 'auto' && window.innerWidth <= 820);
  el.innerHTML = '';
  // Give the book an explicit box so 'stretch' fits inside the stage (no overlap of header/footer).
  el.style.width = availW + 'px';
  el.style.height = availH + 'px';
  el.style.margin = '0 auto';
  // Orientation is decided by StPageFlip as: blockWidth < 2*minWidth && usePortrait -> portrait(single).
  //   single: usePortrait true + minWidth = full width  -> always one page
  //   spread: usePortrait false                          -> always two pages (cover alone via showCover)
  pf = new St.PageFlip(el, {
    width: BASE_W, height: BASE_H, size: 'stretch',
    minWidth: single ? availW : 100, maxWidth: 4000, minHeight: 100, maxHeight: 4000,
    showCover: true, maxShadowOpacity: 0.5, mobileScrollSupport: true,
    usePortrait: single, drawShadow: true, flippingTime: 700
  });
  pf.loadFromImages(IMAGES);
  pf.on('flip', e => { cur = e.data; update(); });
  pf.turnToPage(Math.min(cur, IMAGES.length - 1));
  update();
}
function update() {
  cur = pf.getCurrentPageIndex();
  document.getElementById('counter').textContent = (cur + 1) + ' / ' + IMAGES.length;
  document.getElementById('prev').disabled = cur <= 0;
  document.getElementById('next').disabled = cur >= IMAGES.length - 1;
}
document.getElementById('prev').onclick = () => pf.flipPrev();
document.getElementById('next').onclick = () => pf.flipNext();
function setFs(on) {
  document.body.classList.toggle('fs', on);
  try {
    if (on && document.documentElement.requestFullscreen) document.documentElement.requestFullscreen();
    else if (!on && document.fullscreenElement) document.exitFullscreen();
  } catch (e) {}
  build();  // recompute page size for the new stage dimensions
}
document.getElementById('fs').onclick = () => setFs(!document.body.classList.contains('fs'));
document.getElementById('fsx').onclick = () => setFs(false);
document.addEventListener('fullscreenchange', () => {
  if (!document.fullscreenElement && document.body.classList.contains('fs')) setFs(false);
});
document.addEventListener('keydown', e => {
  if (e.key === 'ArrowLeft') pf.flipPrev();
  if (e.key === 'ArrowRight') pf.flipNext();
});
let rt; window.addEventListener('resize', () => { clearTimeout(rt); rt = setTimeout(build, 200); });
build();
</script>
