<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Selligence Flip-Books — Live Demo</title>
<style>
  :root { --bg:#0e1116; --panel:#171b22; --ink:#e8ecf1; --dim:#9aa4b2; --accent:#c9a24a; }
  * { box-sizing:border-box; }
  html,body { margin:0; height:100%; background:var(--bg); color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif; overscroll-behavior:none; }
  .wrap { display:flex; flex-direction:column; height:100%; }
  header { display:flex; align-items:center; gap:14px; padding:12px 18px;
    background:linear-gradient(180deg,#12151b,#0e1116); border-bottom:1px solid #222834; }
  header .name { font-size:15px; font-weight:600; letter-spacing:.2px; white-space:nowrap;
    overflow:hidden; text-overflow:ellipsis; }
  header .spacer { flex:1; }
  .stage { flex:1; display:flex; align-items:center; justify-content:center; min-height:0;
    padding:22px 16px; }
  #book { touch-action:pan-y; }
  .page-img { width:100%; height:100%; object-fit:cover; display:block;
    box-shadow:0 10px 40px rgba(0,0,0,.45); background:#fff; }
  footer { display:flex; align-items:center; justify-content:center; gap:16px;
    padding:12px; background:#12151b; border-top:1px solid #222834; }
  button { background:var(--panel); color:var(--ink); border:1px solid #2a313d; border-radius:10px;
    padding:9px 16px; font-size:14px; cursor:pointer; transition:.15s; }
  button:hover { border-color:var(--accent); color:#fff; }
  button:disabled { opacity:.35; cursor:default; }
  .counter { min-width:74px; text-align:center; color:var(--dim); font-variant-numeric:tabular-nums; }
  .hint { color:var(--dim); font-size:12.5px; }
  @media (max-width:640px) { header .name { font-size:13px; } .hint { display:none; } button { padding:8px 12px; } }
</style></head>

<div class="wrap">
  <header>
    <span class="name">Selligence Flip-Books — Live Demo</span>
    <span class="spacer"></span>
    <span class="hint">Click a page corner or use ← → to turn</span>
    <button id="fs">Full screen</button>
  </header>
  <div class="stage"><div id="book"></div></div>
  <footer>
    <button id="prev">‹ Prev</button>

    <button id="next">Next ›</button>
  </footer>
</div>

const PORTRAIT = true;
const BASE_W = 600, BASE_H = 780;
const stage = document.querySelector('.stage');
const el = document.getElementById('book');

function computeSize() {
  const availW = stage.clientWidth - 24, availH = stage.clientHeight - 24;
  // in landscape or on wide screens show two pages (a spread), else single page
  const spread = window.innerWidth > 820;
  const ratio = BASE_H / BASE_W;
  let pw = spread ? availW / 2 : availW;
  let ph = pw * ratio;
  if (ph > availH) { ph = availH; pw = ph / ratio; }
  return { w: Math.floor(pw), h: Math.floor(ph), spread };
}
let pf, cur = 0;
function build() {
  const s = computeSize();
  el.innerHTML = '';
  pf = new St.PageFlip(el, {
    width: s.w, height: s.h, size: 'fixed',
    minWidth: 200, maxWidth: 3000, minHeight: 250, maxHeight: 3500,
    showCover: true, maxShadowOpacity: 0.5, mobileScrollSupport: true,
    usePortrait: !s.spread, drawShadow: true, flippingTime: 700
  });
  pf.loadFromImages(IMAGES);
  pf.on('flip', e => { cur = e.data; update(); });
  pf.turnToPage(Math.min(cur, IMAGES.length - 1));
  update();
}
function update() {
  cur = pf.getCurrentPageIndex();
  document.getElementById('counter').textContent = (cur + 1) + ' / ' + IMAGES.length;
  document.getElementById('prev').disabled = cur <= 0;
  document.getElementById('next').disabled = cur >= IMAGES.length - 1;
}
document.getElementById('prev').onclick = () => pf.flipPrev();
document.getElementById('next').onclick = () => pf.flipNext();
document.getElementById('fs').onclick = () => {
  if (!document.fullscreenElement) document.documentElement.requestFullscreen();
  else document.exitFullscreen();
};
document.addEventListener('keydown', e => {
  if (e.key === 'ArrowLeft') pf.flipPrev();
  if (e.key === 'ArrowRight') pf.flipNext();
});
let rt; window.addEventListener('resize', () => { clearTimeout(rt); rt = setTimeout(build, 200); });
build();
</script>
